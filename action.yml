name: "Mainfast Rollcall"
description: "Finds required status checks that do not protect anything (never ran, skipped but counted as passing, renamed, path-filtered, merged while pending, drift) by comparing branch protection and rulesets with what recent PRs reported. Keeps one tracking issue open while something is wrong."
author: "Mainfast authors"
branding:
  icon: "check-square"
  color: "blue"
inputs:
  token:
    description: "Token for the audit. GITHUB_TOKEN works with permissions contents: read, pull-requests: read, statuses: read, checks: write, issues: write. Classic branch protection is read from the \"Get a branch\" API (read access); the admin-only protection endpoint is only a fallback, and if it is refused the report says so in a note."
    default: ${{ github.token }}
  repository:
    description: owner/name to audit. Defaults to the current repository.
    default: ""
  branch:
    description: Protected branch to audit. Defaults to rollcall.branch, else the default branch.
    default: ""
  pulls:
    description: How many recently merged PRs to sample (1..100). Defaults to rollcall.pulls (20).
    default: ""
  open-pulls:
    description: How many open PRs to sample as well (0..100). Defaults to rollcall.openPulls (10).
    default: ""
  config:
    description: "Path to a .mainfast.yml in the workspace. Default: .mainfast.yml read through the API from the default branch (no checkout needed)."
    default: ""
  check-run:
    description: Post the result as a "Mainfast Rollcall" check run on the audited branch's head commit.
    default: "true"
  issue:
    description: Keep one tracking issue open while the audit finds something at the issue-on level, and close it when clean.
    default: "true"
  issue-on:
    description: "error, warning or never: lowest finding level that opens the tracking issue. Defaults to rollcall.issueOn (error)."
    default: ""
  comment-author:
    description: "Login the token posts as (e.g. my-app[bot] for a GitHub App token). Only an issue that carries the Mainfast marker and was opened by this login is ever edited or closed. Default: the token's own user (GET /user), else github-actions[bot]."
    default: ""
  fail-on:
    description: "error, warning or never: lowest finding level that fails the job and the check run. Defaults to rollcall.failOn (error)."
    default: ""
  license:
    description: "Your Mainfast license key (Pro, or the optional free key), from the MAINFAST_LICENSE secret. Optional: no feature needs it, and public repositories and private ones with up to 5 active contributors never need it. Checked once per run with Polar (only the key and the organization id are sent; if Polar cannot be reached, the key counts as valid). Without a Pro key, a larger private repository gets one notice in the job summary; the result never changes."
    default: ""
outputs:
  ok:
    description: "true when no error-level finding"
  conclusion:
    description: "Check-run conclusion: failure, neutral (warnings only) or success"
  issue:
    description: Number of the tracking issue, when there is one
  report:
    description: Full audit report as JSON (required checks, per-check tallies, findings)
runs:
  using: node24
  main: "dist/index.cjs"
